name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # the solver scripts write screenshots to os.tmpdir(); keep them somewhere we can upload
      TMPDIR: ${{ github.workspace }}/.ng-tmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: index.html matches src/
        run: sh tools/check-build.sh

      - name: Install Playwright and Chromium
        run: |
          mkdir -p "$TMPDIR"
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Run the suites, one at a time
        shell: bash
        run: |
          set -o pipefail
          bash tests/run.sh 2>&1 | tee "$TMPDIR/tests.log"

      - name: Upload screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            .ng-tmp/**/*.png
            .ng-tmp/tests.log
          if-no-files-found: ignore
          retention-days: 7
